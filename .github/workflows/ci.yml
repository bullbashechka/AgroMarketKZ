name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Backend tests
        run: cd backend && bun test

      - name: Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: bun run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build contracts
        run: bun run --cwd packages/contracts build

      - name: Deploy backend (Cloudflare Workers)
        working-directory: backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: bun run deploy

      - name: Build webapp
        working-directory: webapp
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: bun run build

      - name: Deploy webapp (Cloudflare Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: backend/node_modules/.bin/wrangler pages deploy webapp/dist --project-name=agromarketkz-webapp
