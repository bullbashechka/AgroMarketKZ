services:
  postgres:
    image: postgres:18-alpine
    container_name: agromarketkz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agromarketkz}
      POSTGRES_USER: ${POSTGRES_USER:-agromarket}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agromarket}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
