name = "agromarketkz-backend"
main = "src/worker.ts"
compatibility_date = "2026-06-28"
# postgres.js использует TCP-сокеты через Node-совместимость на Workers.
compatibility_flags = ["nodejs_compat"]

# API делает несколько последовательных SQL-запросов, а production Supabase расположен
# в AWS Tokyo. Явное размещение убирает межрегиональный round-trip для каждого SQL.
[placement]
region = "aws:ap-northeast-1"

# Сохраняем production-логи для расследований и post-deploy smoke-test.
[observability]
enabled = true
head_sampling_rate = 1

# "0 3 * * *" — ежедневная уборка orphaned-файлов card-images/cards/* (storageCleanup.ts).
# "*/5 * * * *" — проверка здоровья БД/5xx через Analytics Engine (lib/alerts.ts); scheduled()
# в worker.ts ветвится по event.cron.
[triggers]
crons = ["0 3 * * *", "*/5 * * * *"]

[vars]
# Production Pages origin (домен детерминирован CLOUDFLARE_PROJECT_NAME=agromarketkz-webapp).
# Локально переопределяется через backend/.dev.vars (не в git).
WEBAPP_ORIGIN = "https://agromarketkz-webapp.pages.dev"
SUPABASE_URL = "https://qxyieyzfdcosmmckyocm.supabase.co"
SUPABASE_STORAGE_BUCKET = "card-images"
# Прод-бот (Этап 10): username без @. TELEGRAM_MINIAPP_SHORTNAME (shortname Mini App из
# /newapp BotFather, для deep-link-кнопок) пока не задан — не создан отдельный /newapp shortname;
# код гейтит кнопку по отсутствию переменной (см. routes/telegram.ts), деплою не мешает.
TELEGRAM_BOT_USERNAME = "agromarketkzbot"
# Первый прод-запуск — только dry-run (см. backend/README.md). Переключить на "false" только
# после ручной проверки кандидатов по логам (`wrangler tail`) и отдельного deploy.
STORAGE_CLEANUP_DRY_RUN = "true"
AUTH_CACHE_MODE = "disabled"
# Для алертов (lib/alerts.ts) — id аккаунта, не секрет. CF_ANALYTICS_API_TOKEN отдельным
# секретом (права только Account Analytics: Read).
CLOUDFLARE_ACCOUNT_ID = "0b481a63e36d7f8a4b5058544213d90e"

# Секреты на проде задаются через `wrangler secret put` (Этап 10), НЕ в [vars]:
#   JWT_SECRET, TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET, ADMIN_ALLOWLIST,
#   DATABASE_URL, SUPABASE_SERVICE_ROLE_KEY, CF_ANALYTICS_API_TOKEN

# Счётчик исходов запросов для алертинга (см. lib/alerts.ts, app.ts). Датасет создаётся
# автоматически при первой записи — отдельного `wrangler` резервирования не требует.
[[analytics_engine_datasets]]
binding = "REQUEST_METRICS"
dataset = "agromarketkz_requests"

# Начальные пороги требуют наблюдения и настройки по production-трафику.
# Перед deployment проверить namespace_id на уникальность в пределах Cloudflare account.
[[ratelimits]]
name = "API_READ_RATE_LIMITER"
namespace_id = "2026072001"

  [ratelimits.simple]
  limit = 120
  period = 60

[[ratelimits]]
name = "API_MUTATION_RATE_LIMITER"
namespace_id = "2026072002"

  [ratelimits.simple]
  limit = 30
  period = 60

# Широкий потолок по IP под CGNAT, применяется на /auth/* до чтения тела.
[[ratelimits]]
name = "AUTH_RATE_LIMITER"
namespace_id = "2026072601"

  [ratelimits.simple]
  limit = 300
  period = 60

# Основная pre-auth защита: строгий лимит по составному ключу IP + Telegram id.
[[ratelimits]]
name = "AUTH_IDENTITY_RATE_LIMITER"
namespace_id = "2026072602"

  [ratelimits.simple]
  limit = 10
  period = 60

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "2a6a43b891504d61af053a17ca5aa598"

[[kv_namespaces]]
binding = "AUTH_CACHE_KV"
id = "7c37c39ccbf748f196e4f182982b2aa4"

# Notification delivery is durable in app_private.notification_outbox and
# retried by Queue. Create the producer/consumer queues before the first
# production deploy; failed messages land in the DLQ for manual replay.
[[queues.producers]]
binding = "NOTIFICATION_QUEUE"
queue = "agromarketkz-notifications-prod"

[[queues.consumers]]
queue = "agromarketkz-notifications-prod"
max_batch_size = 10
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "agromarketkz-notifications-dlq-prod"
max_concurrency = 5

# Enable only after creating the private bucket and a 90-day Bucket Lock rule:
# [[r2_buckets]]
# binding = "STORAGE_BACKUP"
# bucket_name = "agromarketkz-storage-backup-prod"
